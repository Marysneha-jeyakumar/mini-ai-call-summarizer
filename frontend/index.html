
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Call Summarizer</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #172033;
        }

        .container { max-width: 1200px; margin: auto; }
        h1 { margin-bottom: 8px; }
        h2 { margin-top: 0; font-size: 20px; }
        h3 { font-size: 15px; margin-bottom: 8px; }
        .subtitle { color: #64748b; margin-bottom: 30px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            background: white;
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: 14px Arial, sans-serif;
        }

        textarea:focus, input:focus {
            outline: 2px solid #818cf8;
            border-color: #4f46e5;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            line-height: 1.6;
        }

        input { margin-bottom: 20px; }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #4338ca; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .secondary { background: #eef2ff; color: #4338ca; }
        .secondary:hover { background: #e0e7ff; }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .metric {
            background: #f1f5f9;
            padding: 14px;
            border-radius: 8px;
        }

        .metric span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .metric strong { font-size: 18px; }

        p, li { line-height: 1.7; overflow-wrap: anywhere; }
        ul { padding-left: 22px; }

        .muted { color: #64748b; }
        .positive { color: #15803d; }
        .negative { color: #dc2626; }
        .pending { color: #d97706; }
        .neutral { color: #475569; }

        #message, #emailMessage {
            font-size: 14px;
            margin-top: 12px;
        }

        #message:empty, #emailMessage:empty { display: none; }
        #placeholder { min-height: 400px; }

        hr {
            margin: 24px 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            body { padding: 20px 12px; }
            #placeholder { min-height: 100px; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>📞 AI Call Summarizer</h1>
    <p class="subtitle">Turn call transcripts into actionable summaries.</p>

    <div class="grid">

        <!-- Input section -->
        <div class="card">
            <h2>Call Transcript</h2>

            <label for="password">Demo password</label>
            <input type="password" id="password"
                   placeholder="Enter demo password"
                   autocomplete="current-password">

            <label for="transcript">Paste call transcript</label>
            <textarea id="transcript" maxlength="30000"
                placeholder="Agent: Hello, how can I help you?

Customer: Enter your call transcript here..."></textarea>

            <p class="muted" id="count">0 / 30000 characters</p>

            <button id="generateButton" onclick="generateSummary()">
                Generate Summary
            </button>

            <button class="secondary" id="clearButton" onclick="clearTranscript()">
                Clear Transcript
            </button>

            <p id="message" role="status"></p>
        </div>

        <!-- Output section -->
        <div class="card">
            <h2>Generated Summary</h2>

            <p id="placeholder" class="muted">
                Your AI-generated summary will appear here.
            </p>

            <div id="result" hidden>

                <h3>Overview</h3>
                <p id="summary"></p>

                <h3>Call Purpose</h3>
                <p id="purpose"></p>

                <div class="metrics">
                    <div class="metric">
                        <span>Sentiment</span>
                        <strong id="sentiment"></strong>
                    </div>

                    <div class="metric">
                        <span>Resolution</span>
                        <strong id="resolution"></strong>
                    </div>
                </div>

                <h3>Key Points</h3>
                <ul id="keyPoints"></ul>

                <h3>Action Items</h3>
                <ul id="actionItems"></ul>

                <!-- Email section -->
                <hr>

                <label for="recipientEmail">Recipient Email</label>

                <input type="email" id="recipientEmail"
                       placeholder="Enter email address">

                <button id="sendButton" onclick="sendEmail()">
                    Send Summary
                </button>

                <p id="emailMessage" role="status"></p>

            </div>
        </div>
    </div>
</div>

<script>
    const $ = id => document.getElementById(id);

    let currentSummary = null;
    let summaryTranscript = "";

    // Character count
    function updateCount() {
        $("count").textContent =
            `${$("transcript").value.length} / 30000 characters`;
    }

    $("transcript").addEventListener("input", updateCount);

    // Status messages
    function showMessage(text, color = "muted") {
        $("message").textContent = text;
        $("message").className = color;
    }

    function showEmailMessage(text, color = "muted") {
        $("emailMessage").textContent = text;
        $("emailMessage").className = color;
    }

    // Reset results
    function resetResult() {
        currentSummary = null;
        summaryTranscript = "";

        $("result").hidden = true;
        $("placeholder").hidden = false;

        showEmailMessage("");
    }

    // Clear transcript
    function clearTranscript() {
        if ($("generateButton").disabled) return;

        $("transcript").value = "";
        resetResult();
        showMessage("");
        updateCount();
    }

    // Display list items
    function displayList(id, items) {
        $(id).replaceChildren();

        (items.length ? items : ["No items recorded"]).forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            $(id).appendChild(li);
        });
    }

    // Display metric colors
    function displayMetric(id, value) {
        const colors = {
            Positive: "positive",
            Resolved: "positive",
            Negative: "negative",
            Unresolved: "negative",
            Pending: "pending",
            Mixed: "pending"
        };

        $(id).textContent = value;
        $(id).className = colors[value] || "neutral";
    }

    // Loading state
    function setLoading(loading) {
        $("generateButton").disabled = loading;
        $("clearButton").disabled = loading;
        $("sendButton").disabled = loading;
        $("transcript").readOnly = loading;

        $("generateButton").textContent =
            loading ? "Generating..." : "Generate Summary";
    }

    // Generate summary
    async function generateSummary() {
        const transcript = $("transcript").value.trim();
        const password = $("password").value;

        if (!password.trim())
            return showMessage("Please enter the demo password.", "negative");

        if (!transcript)
            return showMessage("Please enter a call transcript.", "negative");

        if (transcript.length > 30000)
            return showMessage("Transcript is too long.", "negative");

        setLoading(true);
        resetResult();
        showMessage("Analyzing transcript...");

        try {
            const response = await fetch("/api/summarize", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Demo-Password": password
                },
                body: JSON.stringify({ transcript })
            });

            const data = await response.json();

            if (!response.ok)
                throw new Error(
                    typeof data.detail === "string"
                    ? data.detail : "Summarization failed"
                );

            currentSummary = data;
            summaryTranscript = transcript;

            $("summary").textContent = data.summary;
            $("purpose").textContent = data.call_purpose;

            displayMetric("sentiment", data.sentiment);
            displayMetric("resolution", data.resolution_status);

            displayList("keyPoints", data.key_points);
            displayList("actionItems", data.action_items);

            $("placeholder").hidden = true;
            $("result").hidden = false;

            showMessage("Summary generated successfully!", "positive");

        } catch (error) {
            showMessage(error.message || "Something went wrong.", "negative");

        } finally {
            setLoading(false);
        }
    }

    // Send summary email
    async function sendEmail() {
        const email = $("recipientEmail").value.trim();
        const password = $("password").value;

        if (!currentSummary)
            return showEmailMessage("Generate a summary first.", "negative");

        if ($("transcript").value.trim() !== summaryTranscript)
            return showEmailMessage(
                "Transcript changed. Generate a new summary.", "negative"
            );

        if (!email || !$("recipientEmail").checkValidity())
            return showEmailMessage("Enter a valid email address.", "negative");

        if (!password.trim())
            return showEmailMessage("Enter the demo password.", "negative");

        $("sendButton").disabled = true;
        $("generateButton").disabled = true;
        $("clearButton").disabled = true;
        $("transcript").readOnly = true;
        $("recipientEmail").readOnly = true;

        $("sendButton").textContent = "Sending...";
        showEmailMessage("Submitting email...");

        try {
            const response = await fetch("/api/send-summary", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Demo-Password": password
                },
                body: JSON.stringify({
                    email: email,
                    summary: currentSummary
                })
            });

            const data = await response.json();

            if (!response.ok)
                throw new Error(
                    typeof data.detail === "string"
                    ? data.detail : "Failed to send email"
                );

            showEmailMessage(
                "Email submitted successfully!", "positive"
            );

        } catch (error) {
            showEmailMessage(
                error.message || "Failed to send email.", "negative"
            );

        } finally {
            $("sendButton").disabled = false;
            $("generateButton").disabled = false;
            $("clearButton").disabled = false;
            $("transcript").readOnly = false;
            $("recipientEmail").readOnly = false;

            $("sendButton").textContent = "Send Summary";
        }
    }
</script>
</body>
</html>
